{% set edit_mode = edit_mode|default(false) %}{% extends 'base.html' %}{% block content %}
<div class="title">
    <div>
        <h1>Add subscriber</h1>
        <p>Create one reusable consumer for an SLS queue.</p>
    </div>
</div>
<form method="post" class="panel form">
    <label>Name<input name="name" value="{{ sub.name if sub else '' }}" required /></label>
    <label>Entity/table<input name="entity_name" value="{{ sub.entity_name if sub else '' }}" required /></label>
    <label>Authentication endpoint<input name="auth_endpoint" type="url" value="{{ sub.auth_endpoint if sub else '' }}" required /></label>
    <label>Fetch endpoint<input name="fetch_endpoint" type="url" value="{{ sub.fetch_endpoint if sub else '' }}" required /></label>
    <label>Ack endpoint<input name="ack_endpoint" type="url" value="{{ sub.ack_endpoint if sub else '' }}" required /></label>
    <div class="split">
        <label>Method<select name="method"><option>POST</option></select></label>
        <label>Batch limit<input name="batch_limit" type="number" value="{{ sub.batch_limit if sub else '' }}" min="1" required /></label>
        <label>Fetch frequency (seconds)<input name="frequency_seconds" type="number" value="{{ sub.frequency_seconds if sub else '' }}" min="5" required /></label>
    </div>
    <label>Client ID<input name="client_id" value="{{ sub.client_id if sub else '' }}" required /></label>
    <label>Environment<input name="environment" value="{{ sub.environment if sub else '' }}" required /></label>
    {% if not edit_mode %}
    <label>Client Secret
        <input
            name="client_secret"
            type="password"
            autocomplete="new-password"
            required
        >
    </label>
    {% endif %}
    <div class="split">
        <label>Output<select name="output_type"><option value="json_files">JSON files</option></select></label>
        <label>Output path<input name="output_path" value="{{ sub.output_path if sub else '' }}" required /></label>
    </div>
    <div class="actions">
        <a class="button" href="{{ url_for('index') }}">Cancel</a>
        <button class="button primary">{% if edit_mode %} Update Subscriber {% else %} Save Subscriber {% endif %}</button>
    </div>
</form>
{% endblock %}
