{% extends "base.html" %}

{% block content %}

<h1>Connections Grid Test</h1>

<link rel="stylesheet"
href="{{ url_for('static', filename='ag-grid.css') }}">
 
<link rel="stylesheet"
href="{{ url_for('static', filename='ag-theme-alpine.css') }}">
 
<script src="{{ url_for('static', filename='ag-theme-alpine.css') }}">

const rowData = {{ rows|safe }};

console.log(rowData);

const gridOptions = {

    columnDefs: [
        { field: "name" },
        { field: "fetch_type" },
        { field: "fetch_method" },
        { field: "verified" }
    ],

    rowData: rowData,

    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true
    },

    pagination: true
};

document.addEventListener("DOMContentLoaded", function () {

    const gridDiv = document.querySelector("#myGrid");

    new agGrid.Grid(
        gridDiv,
        gridOptions
    );

});

</script>

{% endblock %}
