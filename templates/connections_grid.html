{% extends "base.html" %}

{% block content %}

<div class="title">

    <div>
        <h1>Connections</h1>
        <p>Browse all DataBridge connections.</p>
    </div>

</div>

<!-- AG Grid Styles -->

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpinelpine"
    style="height:700px;width:100%;">
</div>

<pre>{{ rows }}</pre>

<script src="https://cdn.jsdelivr.net/npm/ag-grid-community/distunity.min.jsscript>

<script>

const rowData = {{ rows|safe }};

console.log("Rows:");
console.log(rowData);

const columnDefs = [
    { field: "name" },
    { field: "fetch_type" },
    { field: "fetch_method" },
    { field: "verified" }
];

const gridOptions = {

    columnDefs: columnDefs,

    rowData: rowData,

    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true
    },

    pagination: true,
    paginationPageSize: 25
};

new agGrid.Grid(
    document.getElementById("connectionsGrid"),
    gridOptions
);

</script>

{% endblock %}
