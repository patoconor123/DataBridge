{% extends "base.html" %}

{% block content %}
<h1>Connections Grid Test</h1>

<div
    id="myGrid"
    class="ag-theme-alpine"
    style="height:600px;width:100%;">
</div>

<script>
    const rowData = {{ rows | tojson | safe }};

    const gridOptions = {
        columnDefs: [
            { field: "name" },
            { field: "fetch_type" },
            { field: "fetch_method" },
            { field: "verified" }
        ],
        rowData: rowData,
        defaultColDef: {
            sortable: true,
            filter: true,
            resizable: true
        },
        pagination: true
    };

    document.addEventListener("DOMContentLoaded", function () {
    if (typeof agGrid === 'undefined') {
        console.error("AG Grid library not loaded!");
        return;
    }
    const gridDiv = document.querySelector("#myGrid");
    new agGrid.Grid(gridDiv, gridOptions);
});

</script>
{% endblock %}
