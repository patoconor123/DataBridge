{% extends "base.html" %}

{% block content %}

<div class="title">

    <div>
        <h1>Connections</h1>
        <p>
            Browse all DataBridge connections.
        </p>
    </div>

</div>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/ag-grid-community/styleset"
    href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine   class="ag-theme-alpine"
    style="height:700px;width:100%;">
</div>

<script src="https://cdn.jsdelivr.net/npm/ag-grid-community-community.min.jsscript>

<script>

const rowData = {{ rows|safe }};

const columnDefs = [

    {
        field: "_id",
        hide: true
    },

    {
        field: "name",
        headerName: "Connection Name"
    },

    {
        field: "fetch_type",
        headerName: "Fetch Type"
    },

    {
        field: "fetch_method",
        headerName: "Method"
    },

    {
        field: "verified",
        headerName: "Verified"
    },

    {
        field: "created_at",
        headerName: "Created"
    }

];

const gridOptions = {

    columnDefs: columnDefs,

    rowData: rowData,

    animateRows: true,

    pagination: true,

    paginationPageSize: 20,

    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true
    }

};

new agGrid.Grid(
    document.getElementById("connectionsGrid"),
    gridOptions
);

</script>

{% endblock %}
