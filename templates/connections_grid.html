{% extends "base.html" %}

{% block content %}

<div class="title">

    <div>
        <h1>Connections</h1>
        <p>
            Browse all DataBridge connections.
        </p>
    </div>

</div>

<div class="panel">

    <table class="data-table">

        <thead>

            <tr>
                <th>Name</th>
                <th>Fetch Type</th>
                <th>Method</th>
                <th>Verified</th>
            </tr>

        </thead>

        <tbody>

        {% for row in rows_data %}

            <tr>

                <td>{{ row.name }}</td>

                <td>{{ row.fetch_type }}</td>

                <td>{{ row.fetch_method }}</td>

                <td>{{ row.verified }}</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
