{% extends "base.html" %}

{% block content %}

<h1>Connections Grid Test</h1>

<link rel="stylesheet"
      href="https://app.unpkg.com/@ag-grid-community/styles@28.1.0/files/ag-grid.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/ag-grid/36.2.0/ag-grid-community.min.js">

<script>

const rowData = {{ rows|safe }};

console.log(rowData);

const gridOptions = {

    columnDefs: [
        { field: "name" },
        { field: "fetch_type" },
        { field: "fetch_method" },
        { field: "verified" }
    ],

    rowData: rowData,

    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true
    },

    pagination: true
};

document.addEventListener("DOMContentLoaded", function () {

    const gridDiv = document.querySelector("#myGrid");

    new agGrid.Grid(
        gridDiv,
        gridOptions
    );

});

</script>

{% endblock %}
