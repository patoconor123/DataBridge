{% extends "base.html" %}

{% block content %}

<div class="title">

    <div>
        <h1>Add Connection</h1>
        <p>
            Configure a reusable DataBridge connection.
        </p>
    </div>

</div>

<form method="post" class="panel form">

    <div class="form-grid">

    <label>Connection Name</label>
    <input type="text" name="name"
    value="{{ form_values.get('name', '') }}">

        
<label>Fetch Type</label>
    <select name="fetch_type">

    <option
        value="REST"
        {% if form_values.get('fetch_type', 'REST') == 'REST' %}
        selected
        {% endif %}>
        REST
    </option>

    <option
        value="QUEUE"
        {% if form_values.get('fetch_type') == 'QUEUE' %}
        selected
        {% endif %}>
        Queue
    </option>

    </select>

    <label>Authentication Method</label>

<select name="auth_method">

    <option
        value="POST"
        {% if form_values.get('auth_method', 'POST') == 'POST' %}
        selected
        {% endif %}>
        POST
    </option>

    <option
        value="GET"
        {% if form_values.get('auth_method') == 'GET' %}
        selected
        {% endif %}>
        GET
    </option>

</select>

    <label>Authentication Endpoint</label>
    <input type="text" name="auth_endpoint"
    value="{{ form_values.get('auth_endpoint', '') }}">

    <label>Ack Endpoint</label>
    <input type="text" name="ack_endpoint"
    value="{{ form_values.get('ack_endpoint', '') }}">

    <label>Parameters (JSON)</label>
    <textarea  rows="5"    name="params">
        {{ form_values.get('params', '') }}
    </textarea>

    <label>Request Body (JSON)</label>
    <textarea  rows="5" name="body">
        {{ form_values.get('body', '') }}
    </textarea>

<div class="verification-field">
    <input
        type="checkbox"
        tabindex="-1"
        onclick="return false;"
        {% if connection_verified %}checked{% endif %}>

    {% if connection_verified %}
        <span class="verified-text">Verified</span>
    {% else %}
        <span class="unverified-text">Not verified</span>
    {% endif %}
</div>

{% if connection_message %}

<div class="{% if connection_verified %}
                connection-result connection-success
            {% else %}
                connection-result connection-failure
            {% endif %}">

    <strong>Connection Test Results</strong>

    <pre>{{ connection_message }}</pre>

</div>

{% endif %}
    <div class="actions">

        <div class="form-actions">
 
        <button
        type="submit"
        name="action"
        value="test"
        class="button">
        Test Connection                                                                                                                
        </button>
         
        <button
        type="submit"
        name="action"
        value="save"
        class="button primary">
        Save Connection
        </button>

    </div>

</form>

{% endblock %}
