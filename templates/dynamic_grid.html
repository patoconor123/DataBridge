<div class="grid-container">
<table id="grid" class="display" ></table>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {

    const collection = "{{ collection_name }}";

    fetch(`/api/${collection}`)
        .then(response => response.json())
        .then(data => {

            console.log(data);

            if (!data || data.length === 0) {
                document.getElementById("grid").outerHTML =
                    "<p>No records found.</p>";
                return;
            }

            const allColumns = new Set();

            data.forEach(row => {
                Object.keys(row).forEach(key => {
                    allColumns.add(key);
                });
            });

            const columns = Array.from(allColumns).map(key => ({
                data: key,
                title: key,
                defaultContent: ""
            }));

            $('#grid').DataTable({
                searching: true,
                paging: true,
                ordering: true,
                responsive: false,                            
                data: data,
                columns: columns,
                pageLength: 25,
                scrollX: true,
                autoWidth: false,
                dom: 'Bfrtip',
                buttons: [
                    'colvis'
                ]
            });

        })
        .catch(error => {
            console.error("Error loading data:", error);
        });

});
</script>
