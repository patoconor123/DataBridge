<link rel="stylesheet"
      href="{{ url_for('static', filename='jquery.dataTables.min.css') }}">
<script src="{{ url_for('static', filename='jquery-3.7.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='jquery.dataTables.min.js') }}"></script>
<script>
      $(document).ready(function () {
            console.log("jQuery =", typeof $);
          console.log("Table Count =", $('#connectionsTable').length);
          console.log("DataTable =", typeof $.fn.DataTable );
          $('#connectionsTable').DataTable({
              pageLength: 10,
              searching: true,
              paging: true,
              ordering: true
    });
});
</script>
<table id="grid" class="display" style="width:100%"></table>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const collection = "{{ collection_name }}";

    fetch(`/api/${collection}`)
        .then(response => response.json())
        .then(data => {

            console.log(data);

            if (!data || data.length === 0) {
                document.getElementById("grid").outerHTML =
                    "<p>No records found.</p>";
                return;
            }

            const allColumns = new Set();

            data.forEach(row => {
                Object.keys(row).forEach(key => {
                    allColumns.add(key);
                });
            });

            const columns = Array.from(allColumns).map(key => ({
                data: key,
                title: key,
                defaultContent: ""
            }));

            $('#grid').DataTable({
                data: data,
                columns: columns,
                pageLength: 25,
                scrollX: true,
                autoWidth: false,
                dom: 'Bfrtip',
                buttons: [
                    'colvis'
                ]
            });

        })
        .catch(error => {
            console.error("Error loading data:", error);
        });

});
</script>
