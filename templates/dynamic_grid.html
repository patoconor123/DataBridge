{% extends "base.html" %}

{% block content %}

<table id="grid" class="display" style="width:100%"></table>

<script>
fetch('{{ api_url }}')
  .then(response => response.json())
  .then(data => {

      const columns = Object.keys(data[0]).map(key => ({
          data: key,
          title: key
      }));

      $('#grid').DataTable({
          data: data,
          columns: columns,
          pageLength: 25
      });

  });
</script>

{% endblock %}
