{% extends "base.html" %}

{% block content %}

<div class="title">
    <div>
        <h1>Welcome to DataBridge</h1>
        <p>
            Configure a MongoDB connection to initialize the
            DataBridge platform.
        </p>
    </div>
</div>

<div class="panel form">

    <h2>MongoDB Configuration</h2>

    <form method="post">

        <label>
            Mongo Host
            <input
                type="text"
                name="mongo_host"
                value="{{ config.mongo_host if config else '' }}"
                placeholder="awsohcentricq01.underarmour.com"
                required>
        </label>

        <div class="split">

            <label>
                Mongo Port
                <input
                    type="number"
                    name="mongo_port"
                    value="{{ config.mongo_port if config else '27017' }}"
                    required>
            </label>

            <label>
                Database Name
                <input
                    type="text"
                    name="mongo_database"
                    value="{{ config.mongo_database if config else 'databridge' }}"
                    required>
            </label>

        </div>

        <hr>

        <h3>Authentication (Optional)</h3>

        <div class="split">

            <label>
                Username
                <input
                    type="text"
                    name="mongo_username"
                    value="{{ config.mongo_username if config else '' }}">
            </label>

            <label>
                Password
                <input
                    type="password"
                    name="mongo_password"
                    value="{{ config.mongo_password if config else '' }}">
            </label>

        </div>

            Authentication Database
