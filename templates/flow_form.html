{% extends "base.html" %}

{% block content %}

<div class="title">

    <div>
        <h1>Add Flow</h1>
        <p>
            Configure a reusable DataBridge flow.
        </p>
    </div>

</div>

<form method="post" class="panel form">

    <div class="form-grid">

    <label>Flow Name</label>
    <input type="text" name="name"
    value="{{ form_values.get('name', '') }}">
        <label>Flow Name</label><input type="text" name="name" value="{{ form_values.get('name', '') }}">
<label>Description</label><input type="text" name="name" value="{{ form_values.get('description', '') }}">
<label>Run Type</label><select name="run_type"><option value ="Manual"></option></select>
<label>Load Strategy</label><select name="load_strategy"><option value ="Upsert"></option></select>
<label>Fetch Ack Endpoint</label><input type="text" name="name" value="{{ form_values.get('fetch_ack_endpoint', '') }}">
<label>Fetch Body</label><input type="text" name="name" value="{{ form_values.get('fetch_body', '') }}">
<label>Fetch Connection</label><input type="text" name="name" value="{{ form_values.get('fetch_connection', '') }}">
<label>Fetch Database</label><input type="text" name="name" value="{{ form_values.get('fetch_database', '') }}">
<label>Fetch Endpoint</label><input type="text" name="name" value="{{ form_values.get('fetch_endpoint', '') }}">
<label>Fetch Method</label><input type="text" name="name" value="{{ form_values.get('fetch_method', '') }}">
<label>Fetch Params</label><input type="text" name="name" value="{{ form_values.get('fetch_params', '') }}">
<label>Fetch Query</label><input type="text" name="name" value="{{ form_values.get('fetch_query', '') }}">
<label>Fetch Table</label><input type="text" name="name" value="{{ form_values.get('fetch_table', '') }}">
<label>Send Ack Endpoint</label><input type="text" name="name" value="{{ form_values.get('send_ack_endpoint', '') }}">
<label>Send Body</label><input type="text" name="name" value="{{ form_values.get('send_body', '') }}">
<label>Send Connection</label><input type="text" name="name" value="{{ form_values.get('send_connection', '') }}">
<label>Send Database</label><input type="text" name="name" value="{{ form_values.get('send_database', '') }}">
<label>Send Endpoint</label><input type="text" name="name" value="{{ form_values.get('send_endpoint', '') }}">
<label>Send Method</label><input type="text" name="name" value="{{ form_values.get('send_method', '') }}">
<label>Send Params</label><input type="text" name="name" value="{{ form_values.get('send_params', '') }}">
<label>Send Query</label><input type="text" name="name" value="{{ form_values.get('send_query', '') }}">
<label>Send Table</label><input type="text" name="name" value="{{ form_values.get('send_table', '') }}">


    <div class="actions">

        <div class="form-actions">
 
         
        <button
        type="submit"
        name="action"
        value="save"
        class="button primary">
        Save Connection
        </button>

    </div>

</form>

{% endblock %}
